<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Flat lay of a gift box, watch, sunglasses, ring and serum">
  <defs>
    <linearGradient id="hBg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f8f1e5"/>
      <stop offset="0.55" stop-color="#efe5d5"/>
      <stop offset="1" stop-color="#e2d5c1"/>
    </linearGradient>
    <linearGradient id="hGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eed7a6"/>
      <stop offset="0.5" stop-color="#b4884b"/>
      <stop offset="1" stop-color="#8a6533"/>
    </linearGradient>
    <linearGradient id="hInk" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#312820"/>
      <stop offset="1" stop-color="#14100c"/>
    </linearGradient>
    <linearGradient id="hLeather" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#5c4835"/>
      <stop offset="1" stop-color="#2f251c"/>
    </linearGradient>
    <radialGradient id="hDial" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ded4c3"/>
    </radialGradient>
    <linearGradient id="hGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ddcfba" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#hBg)"/>

  <!-- soft rings -->
  <circle cx="400" cy="470" r="300" fill="#ffffff" opacity="0.42"/>
  <circle cx="400" cy="470" r="300" fill="none" stroke="#b4884b" stroke-width="1" opacity="0.22"/>
  <circle cx="400" cy="470" r="366" fill="none" stroke="#b4884b" stroke-width="1" opacity="0.12"/>

  <!-- ================= gift box (centre) ================= -->
  <g>
    <ellipse cx="400" cy="712" rx="196" ry="26" fill="#2b211a" opacity="0.12"/>
    <rect x="248" y="512" width="304" height="196" rx="14" fill="url(#hInk)"/>
    <rect x="378" y="512" width="44" height="196" fill="url(#hGold)"/>
    <rect x="232" y="470" width="336" height="56" rx="14" fill="#372e25"/>
    <rect x="378" y="470" width="44" height="56" fill="url(#hGold)"/>
    <rect x="232" y="516" width="336" height="8" fill="#0e0b08" opacity="0.45"/>
    <!-- bow -->
    <path d="M400 470c-13-25-48-50-76-38-22 10-19 38 7 44 22 5 51-2 69-6z" fill="url(#hGold)"/>
    <path d="M400 470c13-25 48-50 76-38 22 10 19 38-7 44-22 5-51-2-69-6z" fill="url(#hGold)"/>
    <ellipse cx="400" cy="470" rx="25" ry="20" fill="#d8b878"/>
    <ellipse cx="394" cy="464" rx="9" ry="7" fill="#f6e8cd" opacity="0.85"/>
  </g>

  <!-- ================= watch (upper left) ================= -->
  <g transform="translate(168 268) rotate(-12)">
    <path d="M-26 -104h52l-6 62h-40z" fill="url(#hLeather)"/>
    <path d="M-26 42h52l8 66h-68z" fill="url(#hLeather)"/>
    <circle cx="0" cy="0" r="76" fill="url(#hGold)"/>
    <circle cx="0" cy="0" r="62" fill="url(#hDial)"/>
    <rect x="74" y="-10" width="14" height="20" rx="4" fill="#a97c3f"/>
    <g stroke="#3a3128" stroke-width="3" stroke-linecap="round">
      <path d="M0 -52v11M0 41v11M52 0h11M-63 0h11"/>
    </g>
    <path d="M0 0V-40" stroke="#241d16" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M0 0l32 20" stroke="#241d16" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 0l-22 30" stroke="#b4884b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#241d16"/>
    <path d="M-44 -28a62 62 0 0 1 38-32" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- ================= sunglasses (upper right) ================= -->
  <g transform="translate(614 250) rotate(10) scale(0.94)">
    <path d="M-104 6c-12 5-20 28-18 60" fill="none" stroke="url(#hGold)" stroke-width="8" stroke-linecap="round"/>
    <path d="M104 6c12 5 20 28 18 60" fill="none" stroke="url(#hGold)" stroke-width="8" stroke-linecap="round"/>
    <rect x="-104" y="-30" width="92" height="72" rx="22" fill="#2c241b"/>
    <rect x="12" y="-30" width="92" height="72" rx="22" fill="#2c241b"/>
    <path d="M-90 30l42-52" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.18"/>
    <path d="M26 30l42-52" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.18"/>
    <rect x="-104" y="-30" width="92" height="72" rx="22" fill="none" stroke="url(#hGold)" stroke-width="7"/>
    <rect x="12" y="-30" width="92" height="72" rx="22" fill="none" stroke="url(#hGold)" stroke-width="7"/>
    <path d="M-12 -14c8-8 16-8 24 0" fill="none" stroke="url(#hGold)" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- ================= ring (lower left) ================= -->
  <g transform="translate(150 660)">
    <ellipse cx="0" cy="0" rx="46" ry="54" fill="none" stroke="url(#hGold)" stroke-width="13"/>
    <ellipse cx="0" cy="0" rx="46" ry="54" fill="none" stroke="#fff3dc" stroke-width="2" opacity="0.5"/>
    <g transform="translate(0 -66)">
      <path d="M0 -24l22 16-22 32-22-32z" fill="#e8f0f6"/>
      <path d="M0 -24l22 16h-44z" fill="#ffffff"/>
      <path d="M-22 -8L0 24l22-32" fill="none" stroke="#8fa9bd" stroke-width="1.3" opacity="0.7"/>
    </g>
  </g>

  <!-- ================= serum bottle (lower right) ================= -->
  <g transform="translate(636 632)">
    <ellipse cx="0" cy="130" rx="62" ry="12" fill="#2b211a" opacity="0.12"/>
    <rect x="-46" y="-24" width="92" height="154" rx="18" fill="url(#hGlass)"/>
    <path d="M-40 42h80v70a18 18 0 0 1-18 18h-44a18 18 0 0 1-18-18z" fill="#d9b273" opacity="0.85"/>
    <rect x="-46" y="-24" width="92" height="154" rx="18" fill="none" stroke="#cbbca6" stroke-width="2"/>
    <rect x="-20" y="-52" width="40" height="30" rx="6" fill="#efe6d8" stroke="#cbbca6" stroke-width="1.5"/>
    <rect x="-32" y="-88" width="64" height="38" rx="10" fill="url(#hGold)"/>
    <rect x="-24" y="-114" width="48" height="30" rx="13" fill="#332a21"/>
    <rect x="-32" y="56" width="64" height="46" rx="6" fill="#ffffff" opacity="0.92"/>
    <rect x="-22" y="70" width="44" height="4" rx="2" fill="#b4884b"/>
    <rect x="-22" y="82" width="30" height="3" rx="1.5" fill="#cfc3b1"/>
    <path d="M-32 6v96" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- ================= wallet (bottom centre-left) ================= -->
  <g transform="translate(320 828) rotate(-6)">
    <ellipse cx="0" cy="48" rx="104" ry="14" fill="#2b211a" opacity="0.12"/>
    <rect x="-96" y="-40" width="192" height="86" rx="12" fill="url(#hLeather)"/>
    <rect x="-86" y="-30" width="172" height="66" rx="8" fill="none" stroke="#b4884b" stroke-width="1.4" stroke-dasharray="5 6" opacity="0.7"/>
    <rect x="-96" y="4" width="192" height="12" fill="#1c1610" opacity="0.45"/>
    <rect x="-16" y="-2" width="32" height="26" rx="6" fill="#b4884b"/>
  </g>

  <!-- sparkles -->
  <g fill="#b4884b">
    <path d="M300 200l6 18 18 6-18 6-6 18-6-18-18-6 18-6z" opacity="0.7"/>
    <path d="M700 452l4.5 13.5 13.5 4.5-13.5 4.5-4.5 13.5-4.5-13.5-13.5-4.5 13.5-4.5z" opacity="0.55"/>
    <path d="M96 460l4 12 12 4-12 4-4 12-4-12-12-4 12-4z" opacity="0.5"/>
  </g>
</svg>
