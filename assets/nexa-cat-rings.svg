<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Rings and fine jewellery">
  <defs>
    <linearGradient id="rBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf6f0"/>
      <stop offset="1" stop-color="#eae0d3"/>
    </linearGradient>
    <linearGradient id="rBand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eed7a6"/>
      <stop offset="0.4" stop-color="#b4884b"/>
      <stop offset="0.7" stop-color="#8d6634"/>
      <stop offset="1" stop-color="#d8b878"/>
    </linearGradient>
    <linearGradient id="rSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f2f0"/>
      <stop offset="0.5" stop-color="#c3c3bf"/>
      <stop offset="1" stop-color="#9b9b96"/>
    </linearGradient>
    <linearGradient id="rGem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#dce8f0"/>
      <stop offset="1" stop-color="#a9c2d4"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" fill="url(#rBg)"/>
  <circle cx="200" cy="250" r="140" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="212" cy="396" rx="104" ry="14" fill="#2b211a" opacity="0.09"/>

  <!-- back silver band, tilted -->
  <g transform="rotate(-14 140 300)">
    <ellipse cx="140" cy="300" rx="54" ry="62" fill="none" stroke="url(#rSilver)" stroke-width="13"/>
    <ellipse cx="140" cy="300" rx="54" ry="62" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.55"/>
  </g>

  <!-- main gold solitaire -->
  <ellipse cx="228" cy="292" rx="66" ry="76" fill="none" stroke="url(#rBand)" stroke-width="16"/>
  <ellipse cx="228" cy="292" rx="66" ry="76" fill="none" stroke="#fff3dc" stroke-width="2.5" opacity="0.5"/>

  <!-- prongs -->
  <g stroke="#a97c3f" stroke-width="5" stroke-linecap="round">
    <path d="M210 224l8 14M246 224l-8 14"/>
  </g>

  <!-- gem -->
  <g transform="translate(228 194)">
    <path d="M0 -34l32 22-32 44-32-44z" fill="url(#rGem)"/>
    <path d="M0 -34l32 22H-32z" fill="#ffffff" opacity="0.85"/>
    <path d="M-32 -12L0 32l32-44" fill="none" stroke="#8fa9bd" stroke-width="1.4" opacity="0.7"/>
    <path d="M-12 -12L0 32l12-44" fill="none" stroke="#8fa9bd" stroke-width="1.2" opacity="0.55"/>
    <path d="M-32 -12h64" stroke="#7f97aa" stroke-width="1.4" opacity="0.6"/>
  </g>

  <!-- sparkles -->
  <g fill="#b4884b" opacity="0.85">
    <path d="M300 178l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/>
    <path d="M126 200l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" opacity="0.7"/>
    <path d="M316 320l2.5 7.5 7.5 2.5-7.5 2.5-2.5 7.5-2.5-7.5-7.5-2.5 7.5-2.5z" opacity="0.6"/>
  </g>
</svg>
