<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Curated gift sets">
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f5ee"/>
      <stop offset="1" stop-color="#e9dfd1"/>
    </linearGradient>
    <linearGradient id="gBox" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#26201a"/>
      <stop offset="1" stop-color="#14100c"/>
    </linearGradient>
    <linearGradient id="gLid" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#372e25"/>
      <stop offset="1" stop-color="#1d1811"/>
    </linearGradient>
    <linearGradient id="gRibbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8ce9c"/>
      <stop offset="0.5" stop-color="#b4884b"/>
      <stop offset="1" stop-color="#8b6634"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" fill="url(#gBg)"/>
  <circle cx="200" cy="248" r="138" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="200" cy="390" rx="126" ry="16" fill="#2b211a" opacity="0.1"/>

  <!-- small side box -->
  <rect x="66" y="292" width="82" height="76" rx="8" fill="#efe5d6"/>
  <rect x="66" y="292" width="82" height="76" rx="8" fill="none" stroke="#d6c8b3" stroke-width="1.5"/>
  <rect x="98" y="292" width="18" height="76" fill="url(#gRibbon)" opacity="0.85"/>
  <rect x="62" y="286" width="90" height="18" rx="6" fill="#e2d5c1"/>

  <!-- main box body -->
  <rect x="128" y="224" width="176" height="146" rx="10" fill="url(#gBox)"/>
  <rect x="186" y="224" width="30" height="146" fill="url(#gRibbon)"/>

  <!-- lid -->
  <rect x="116" y="196" width="200" height="42" rx="10" fill="url(#gLid)"/>
  <rect x="186" y="196" width="30" height="42" fill="url(#gRibbon)"/>
  <rect x="116" y="230" width="200" height="6" fill="#0e0b08" opacity="0.5"/>

  <!-- bow -->
  <g>
    <path d="M201 196c-8-16-30-32-48-24-14 6-12 24 4 28 14 3 32-1 44-4z" fill="url(#gRibbon)"/>
    <path d="M201 196c8-16 30-32 48-24 14 6 12 24-4 28-14 3-32-1-44-4z" fill="url(#gRibbon)"/>
    <path d="M201 196c-8-16-30-32-48-24" fill="none" stroke="#7d5a2b" stroke-width="1.5" opacity="0.5"/>
    <path d="M201 196c8-16 30-32 48-24" fill="none" stroke="#7d5a2b" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="201" cy="196" rx="16" ry="13" fill="#d8b878"/>
    <ellipse cx="197" cy="192" rx="6" ry="4.5" fill="#f4e3c4" opacity="0.85"/>
  </g>

  <!-- ribbon tails -->
  <path d="M186 206c-14 16-28 22-44 24l10-22z" fill="#a97c3f" opacity="0.9"/>
  <path d="M216 206c14 16 28 22 44 24l-10-22z" fill="#a97c3f" opacity="0.9"/>

  <!-- gold monogram on box -->
  <g opacity="0.9" transform="translate(252 300)">
    <path d="M-12 12V-12L12 12V-12" fill="none" stroke="#b4884b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- sparkles -->
  <g fill="#b4884b" opacity="0.75">
    <path d="M312 158l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/>
    <path d="M96 200l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" opacity="0.7"/>
  </g>
</svg>
