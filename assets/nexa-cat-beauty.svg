<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Beauty and skincare">
  <defs>
    <linearGradient id="bBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7f2"/>
      <stop offset="1" stop-color="#ece2d6"/>
    </linearGradient>
    <linearGradient id="bGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#f0e6d6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#dbcdb8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="bSerum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d9a8"/>
      <stop offset="1" stop-color="#c99b53"/>
    </linearGradient>
    <linearGradient id="bCap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3c690"/>
      <stop offset="0.5" stop-color="#b4884b"/>
      <stop offset="1" stop-color="#8a6533"/>
    </linearGradient>
    <linearGradient id="bJar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6dccc"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" fill="url(#bBg)"/>
  <circle cx="200" cy="240" r="136" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="200" cy="394" rx="118" ry="15" fill="#2b211a" opacity="0.09"/>

  <!-- back jar -->
  <g>
    <rect x="252" y="290" width="86" height="66" rx="12" fill="url(#bJar)"/>
    <rect x="252" y="290" width="86" height="66" rx="12" fill="none" stroke="#d5c8b4" stroke-width="1.5"/>
    <rect x="246" y="272" width="98" height="24" rx="9" fill="url(#bCap)"/>
    <rect x="268" y="316" width="54" height="4" rx="2" fill="#d9bc86"/>
    <rect x="268" y="328" width="34" height="4" rx="2" fill="#e5dccd"/>
  </g>

  <!-- small tube left -->
  <g>
    <path d="M64 320h56v36a10 10 0 0 1-10 10H74a10 10 0 0 1-10-10z" fill="#f3ece1"/>
    <path d="M64 240h56v80H64z" fill="url(#bJar)"/>
    <path d="M64 240h56v80H64z" fill="none" stroke="#d5c8b4" stroke-width="1.5"/>
    <rect x="78" y="220" width="28" height="22" rx="5" fill="url(#bCap)"/>
    <rect x="78" y="266" width="28" height="4" rx="2" fill="#d9bc86"/>
  </g>

  <!-- hero serum bottle -->
  <g>
    <rect x="152" y="196" width="96" height="170" rx="20" fill="url(#bGlass)"/>
    <path d="M158 262h84v82a20 20 0 0 1-20 20h-44a20 20 0 0 1-20-20z" fill="url(#bSerum)" opacity="0.85"/>
    <rect x="152" y="196" width="96" height="170" rx="20" fill="none" stroke="#cbbca6" stroke-width="2"/>
    <!-- neck + dropper cap -->
    <rect x="180" y="164" width="40" height="34" rx="6" fill="#efe6d8"/>
    <rect x="180" y="164" width="40" height="34" rx="6" fill="none" stroke="#cbbca6" stroke-width="1.5"/>
    <rect x="168" y="126" width="64" height="42" rx="10" fill="url(#bCap)"/>
    <rect x="176" y="98" width="48" height="32" rx="14" fill="#3a3026"/>
    <!-- label -->
    <rect x="168" y="280" width="64" height="48" rx="6" fill="#ffffff" opacity="0.9"/>
    <rect x="178" y="294" width="44" height="4" rx="2" fill="#b4884b"/>
    <rect x="178" y="306" width="32" height="3" rx="1.5" fill="#cfc3b1"/>
    <rect x="178" y="314" width="38" height="3" rx="1.5" fill="#cfc3b1"/>
    <!-- glass shine -->
    <path d="M168 224v112" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- droplet + sparkle -->
  <path d="M296 196c0 9-7 16-16 16s-16-7-16-16 16-28 16-28 16 19 16 28z" fill="#b4884b" opacity="0.35"/>
  <g fill="#b4884b" opacity="0.8">
    <path d="M118 172l3.5 10.5 10.5 3.5-10.5 3.5-3.5 10.5-3.5-10.5-10.5-3.5 10.5-3.5z"/>
  </g>
</svg>
